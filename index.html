<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="playing-cards" >
        <!--cards go below should have three div elements to create card-->
        <div class="card">
            <div class="left">
                <div>A</div>
                <div>♠</div>
            </div>
            <div class="middle">
                <div>♠</div>
            </div>
            <div class="right">
                <div class="flipped">♠</div>
                <div class="">A</div>
            </div>
        </div>
        <!--card two-->
        <div class="card">
            <div class="left">
                <div>2</div>
                <div>♣</div>    
            </div>
            <div class="middle">
                <div>♣</div> 
                <div class="flipped">♣</div> 
            </div>
            <div class="right">
                <div class="flipped">♣</div> 
                <div class="flipped">2</div> 
            </div>
        </div>
        <!--third card-->
        <div class="card red">
            <div class="left">
                <div>3</div>
                <div>♥</div>
            </div>
            <div class="middle">
                <div>♥</div>
                <div>♥</div>
                <div class="flipped">♥</div>
            </div>
            <div class="right">
                <div class="fllipped">♥</div>
                <div class="flipped">3</div>
            </div>
        </div>
    </main>
</body>
</html>
